<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="900" height="530" fill="#ffffff"/>

  <!-- ===== Browser (the web app) ===== -->
  <rect x="170" y="16" width="520" height="448" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="44" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Browser · Site Weather Dashboard</text>
  <text x="430" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">index.html + script.js + Chart.js — files hosted on GitHub Pages</text>

  <text x="200" y="92" font-size="11" font-weight="700" letter-spacing="1.5" fill="#2563eb">REQUEST →</text>
  <text x="660" y="298" text-anchor="end" font-size="11" font-weight="700" letter-spacing="1.5" fill="#059669">← RESPONSE</text>

  <!-- 1 Build request -->
  <rect x="200" y="100" width="200" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="226" cy="140" r="14" fill="#2563eb"/>
  <text x="226" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="250" y="128" font-size="15" font-weight="700" fill="#0f172a">Build request</text>
  <text x="250" y="148" font-size="12" fill="#475569">chosen site →</text>
  <text x="250" y="164" font-size="12" fill="#475569">latitude, longitude</text>

  <!-- 2 Send HTTP GET -->
  <rect x="460" y="100" width="200" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="486" cy="140" r="14" fill="#2563eb"/>
  <text x="486" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="510" y="128" font-size="15" font-weight="700" fill="#0f172a">Send HTTP GET</text>
  <text x="510" y="148" font-size="12" fill="#475569">fetch(url) to</text>
  <text x="510" y="164" font-size="12" fill="#475569">Open-Meteo</text>

  <!-- 3 Parse & process -->
  <rect x="460" y="306" width="200" height="80" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <circle cx="486" cy="346" r="14" fill="#059669"/>
  <text x="486" y="351" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
  <text x="510" y="334" font-size="15" font-weight="700" fill="#0f172a">Parse &amp; process</text>
  <text x="510" y="354" font-size="12" fill="#475569">time labels, max wind,</text>
  <text x="510" y="370" font-size="12" fill="#475569">hours over limits</text>

  <!-- 4 Show results -->
  <rect x="200" y="306" width="200" height="80" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <circle cx="226" cy="346" r="14" fill="#059669"/>
  <text x="226" y="351" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
  <text x="250" y="334" font-size="15" font-weight="700" fill="#0f172a">Show results</text>
  <text x="250" y="354" font-size="12" fill="#475569">3 summary cards +</text>
  <text x="250" y="370" font-size="12" fill="#475569">Chart.js line chart</text>

  <!-- Error note -->
  <rect x="200" y="414" width="460" height="34" rx="9" fill="#fef2f2" stroke="#fca5a5"/>
  <circle cx="220" cy="431" r="9" fill="#dc2626"/>
  <text x="220" y="435.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">!</text>
  <text x="236" y="435.5" font-size="12" fill="#b91c1c">If the request fails (e.g. error 503), the page shows a red error message.</text>

  <!-- ===== User ===== -->
  <rect x="10" y="100" width="120" height="286" rx="14" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <circle cx="70" cy="196" r="17" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <path d="M42,252 a28,28 0 0 1 56,0 z" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="282" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">User</text>
  <text x="70" y="301" text-anchor="middle" font-size="11.5" fill="#64748b">site manager</text>
  <text x="70" y="316" text-anchor="middle" font-size="11.5" fill="#64748b">or engineer</text>

  <!-- ===== Open-Meteo API ===== -->
  <rect x="770" y="100" width="120" height="286" rx="14" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <path d="M808,226 H852 A13,13 0 0 0 852,200 A19,19 0 0 0 816,196 A15,15 0 0 0 808,226 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
  <text x="830" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Open-Meteo</text>
  <text x="830" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">API</text>
  <text x="830" y="304" text-anchor="middle" font-size="11.5" fill="#64748b">free weather</text>
  <text x="830" y="319" text-anchor="middle" font-size="11.5" fill="#64748b">forecast data</text>

  <!-- ===== Arrows: request (blue) ===== -->
  <line x1="130" y1="140" x2="198" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
  <text x="164" y="131" text-anchor="middle" font-size="11.5" fill="#1e40af">chosen site</text>

  <line x1="400" y1="140" x2="458" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
  <text x="430" y="131" text-anchor="middle" font-size="11.5" fill="#1e40af">URL</text>

  <line x1="660" y1="140" x2="768" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
  <text x="714" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af" paint-order="stroke" stroke="#fff" stroke-width="5">HTTP GET</text>
  <text x="714" y="158" text-anchor="middle" font-size="11" fill="#1e40af" paint-order="stroke" stroke="#fff" stroke-width="5">lat, lon, hourly</text>

  <!-- ===== Arrows: response (green) ===== -->
  <line x1="770" y1="346" x2="662" y2="346" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/>
  <text x="716" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#047857" paint-order="stroke" stroke="#fff" stroke-width="5">JSON</text>
  <text x="716" y="364" text-anchor="middle" font-size="11" fill="#047857" paint-order="stroke" stroke="#fff" stroke-width="5">48 hourly values</text>

  <line x1="460" y1="346" x2="402" y2="346" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/>
  <text x="431" y="337" text-anchor="middle" font-size="11.5" fill="#047857">results</text>

  <line x1="200" y1="346" x2="132" y2="346" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/>
  <text x="166" y="337" text-anchor="middle" font-size="11.5" fill="#047857">dashboard</text>

  <!-- ===== Arrow: user changes wind limit (orange, dashed) ===== -->
  <path d="M130,240 H560 V304" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-orange)"/>
  <text x="345" y="230" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">Change wind limit</text>
  <text x="345" y="258" text-anchor="middle" font-size="11.5" fill="#c2410c">recount + redraw only — no new API request</text>

  <!-- ===== Legend ===== -->
  <line x1="20" y1="500" x2="52" y2="500" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <text x="60" y="504.5" font-size="12.5" fill="#334155">Request (steps 1–2)</text>
  <line x1="215" y1="500" x2="247" y2="500" stroke="#059669" stroke-width="2.5" marker-end="url(#a-green)"/>
  <text x="255" y="504.5" font-size="12.5" fill="#334155">Response and results (steps 3–4)</text>
  <line x1="470" y1="500" x2="502" y2="500" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a-orange)"/>
  <text x="510" y="504.5" font-size="12.5" fill="#334155">User interaction</text>
  <text x="880" y="504.5" text-anchor="end" font-size="12.5" font-weight="700" fill="#0f172a">Follow the numbers 1 → 4</text>
</svg>
